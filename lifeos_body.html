   RAHUL LIFE OS — every number below derives from CHART (the verified model)
   or from declared arithmetic. Nothing is invented. Where a value is not
   reliably computable it renders as DATA NOT VERIFIED.
   ========================================================================= */
const NOW = new Date('2026-08-30T00:00:00Z');
const BIRTH = new Date('2003-01-20T00:00:00Z');
const AGE = () => Math.floor((NOW-BIRTH)/(365.2425*864e5));

/* ---- house → life-area registry (declared, same as the dashboard doc) ---- */
const REQ={Sun:5,Moon:6,Mars:5,Mercury:7,Jupiter:6.5,Venus:5.5,Saturn:5};
const AREA_H={Wealth:[2,11],Career:[10],Education:[4,5],Business:[7,10,3],Investments:[8,11],
  Relationships:[7],Energy:[1,6],Reputation:[10,1],Networking:[11,3],Creativity:[5],
  Travel:[12,9],Growth:[9,12]};
const hById=h=>CHART.houses.find(x=>x.h===h);
function areaScore(a){
  const hs=AREA_H[a]; let t=0;
  hs.forEach(h=>{const H=hById(h),L=CHART.shadbala[H.lord];
    t+=5*(H.sav/28.1)*(L.r/L.req);});
  return Math.max(1,Math.min(10,t/hs.length));
}
function areaWhy(a){
  return AREA_H[a].map(h=>{const H=hById(h),L=CHART.shadbala[H.lord];
    return `H${h} ${H.sign}: ${H.sav} bindus, lord ${H.lord} ${L.r}/${L.req} rupas (${L.pct}%)`;}).join(' · ');
}
const AREAS=Object.keys(AREA_H);
const SCORES={}; AREAS.forEach(a=>SCORES[a]=+areaScore(a).toFixed(1));

/* ---- functional nature for Dhanu lagna ---- */
const RULES={}; CHART.houses.forEach(h=>{(RULES[h.lord]=RULES[h.lord]||[]).push(h.h)});
function nature(g){
  if(g==='Rahu'||g==='Ketu')return'node';
  const hs=RULES[g]||[], tri=hs.filter(h=>[1,5,9].includes(h)), dus=hs.filter(h=>[6,8,12].includes(h));
  if(tri.length&&!dus.length)return'benefic'; if(tri.length&&dus.length)return'mixed';
  if(dus.length)return'malefic'; return'neutral';
}
const NATLABEL={benefic:'functional benefic',mixed:'mixed',malefic:'functional malefic',neutral:'neutral',node:'node'};

/* ---- dasha lookup ---- */
function dashaAt(iso){
  for(const m of CHART.dasha){ if(iso>=m.start&&iso<m.end){
    for(const a of m.ads){ if(iso>=a.start&&iso<a.end) return {md:m.lord,ad:a.lord,mdEnd:m.end,adEnd:a.end}; }
    return {md:m.lord,ad:null,mdEnd:m.end,adEnd:null}; } }
  return {md:null,ad:null};
}
function monthAt(ym){ return CHART.months.find(m=>m.ym===ym); }

/* ---- profection ---- */
function profection(age){
  const h=(age%12)+1, sign=hById(h).sign, lord=hById(h).lord;
  return {h,sign,lord};
}
