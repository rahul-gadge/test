<title>Rahul Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap">
<style>
/* dark-first: :root carries the DARK palette; light is the explicit alternative */
:root{
  --bg:#0A0D12; --panel:#111721; --panel2:#161E2A; --sunk:#070A0E;
  --tx:#E8EDF5; --tx2:#96A3B8; --tx3:#65718A;
  --line:#1E2632; --line2:#2B3648;
  --acc:#8B9DFF; --acc2:#F5C97B; --accSoft:#161D3A;
  --good:#52C98B; --goodS:#0F2620; --warn:#E8C468; --warnS:#2A2413;
  --caut:#E89B58; --cautS:#2A1D12; --risk:#E8705F; --riskS:#2C1614;
  --xform:#A78BFA; --xformS:#1E1733;
  --ui:"Sora",system-ui,-apple-system,sans-serif;
  --mo:"Azeret Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#F5F7FA; --panel:#FFFFFF; --panel2:#EDF1F6; --sunk:#E2E8F0;
  --tx:#0F1621; --tx2:#4A5668; --tx3:#77839A;
  --line:#DCE3EC; --line2:#C3CDDB;
  --acc:#4356C4; --acc2:#9A6E1E; --accSoft:#E6EAFB;
  --good:#1F7A52; --goodS:#DFF0E7; --warn:#8A6A16; --warnS:#F7EEDA;
  --caut:#9A5A1E; --cautS:#F8E7D8; --risk:#A8382A; --riskS:#F9E2DE;
  --xform:#6B46C1; --xformS:#EDE6FA;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mo{font-family:var(--mo);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- shell ---- */
.top{position:sticky;top:0;z-index:50;background:rgba(10,13,18,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
:root[data-theme="light"] .top{background:rgba(245,247,250,.92)}
.topin{max-width:1400px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.02em;font-size:17px;display:flex;align-items:center;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.tmeta{font-family:var(--mo);font-size:11px;color:var(--tx3);display:flex;gap:14px;flex-wrap:wrap}
.tmeta b{color:var(--tx2);font-weight:500}
.spacer{flex:1}
.tog{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.tog button{padding:5px 11px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--tx3);background:transparent;transition:.15s}
.tog button[aria-pressed="true"]{background:var(--acc);color:#0A0D12}
:root[data-theme="light"] .tog button[aria-pressed="true"]{color:#fff}

nav.side{border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
nav.side .nin{max-width:1400px;margin:0 auto;padding:0 14px;display:flex;gap:2px}
nav.side button{padding:11px 13px;font-size:12.5px;font-weight:500;color:var(--tx3);white-space:nowrap;border-bottom:2px solid transparent;transition:.15s}
nav.side button:hover{color:var(--tx2)}
nav.side button[aria-current="true"]{color:var(--acc);border-bottom-color:var(--acc)}
main{max-width:1400px;margin:0 auto;padding:22px 20px 90px}

/* ---- primitives ---- */
h2.sec{font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--acc);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
h3{font-size:1.05rem;font-weight:600;margin:22px 0 9px;letter-spacing:-.01em}
h4{font-size:.9rem;font-weight:600;margin:0 0 7px}
p{margin:0 0 11px;max-width:70ch}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
.card.tight{padding:12px 14px}
.k{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3)}
.big{font-size:30px;font-weight:700;letter-spacing:-.03em;font-family:var(--mo);line-height:1.1;margin-top:5px}
.sub{font-size:12px;color:var(--tx3);margin-top:4px;line-height:1.45}
.mode{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:4px}
.m-ATTACK{background:var(--good);color:#06120C}
.m-BUILD{background:var(--accSoft);color:var(--acc);border:1px solid var(--acc)}
.m-TRANSITION{background:var(--warnS);color:var(--warn);border:1px solid var(--warn)}
.m-PROTECT{background:var(--cautS);color:var(--caut);border:1px solid var(--caut)}
.m-HARVEST{background:var(--goodS);color:var(--good);border:1px solid var(--good)}
:root[data-theme="light"] .m-ATTACK{color:#fff}
.pill{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:3px;vertical-align:1px}
.p-vh{background:var(--good);color:#06120C} .p-h{background:var(--goodS);color:var(--good);border:1px solid var(--good)}
.p-m{background:var(--warnS);color:var(--warn);border:1px solid var(--warn)}
.p-l{background:var(--cautS);color:var(--caut);border:1px solid var(--caut)}
.p-s{background:var(--panel2);color:var(--tx3);border:1px solid var(--line2)}
:root[data-theme="light"] .p-vh{color:#fff}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .35s}
.b-good i{background:var(--good)} .b-warn i{background:var(--warn)}
.b-caut i{background:var(--caut)} .b-risk i{background:var(--risk)}
.b-acc i{background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);background:var(--panel2);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--acc)}
td.n,th.n{font-family:var(--mo);font-variant-numeric:tabular-nums;white-space:nowrap}
.why{font-size:10px;font-weight:600;color:var(--acc);border:1px solid var(--line2);border-radius:4px;padding:2px 7px;margin-left:7px;letter-spacing:.05em}
.why:hover{background:var(--accSoft)}
.whybox{display:none;margin-top:9px;padding:11px 13px;background:var(--sunk);border-left:3px solid var(--acc);border-radius:0 6px 6px 0;font-size:12.5px;color:var(--tx2);line-height:1.55;font-family:var(--mo)}
.whybox.on{display:block}
.simpleOnly{display:none} body.simple .simpleOnly{display:block}
body.simple .expertOnly{display:none}
.note{background:var(--panel2);border-left:3px solid var(--acc2);border-radius:0 8px 8px 0;padding:12px 15px;margin:12px 0;font-size:13.5px;color:var(--tx2)}
.note b{color:var(--tx)}
.note.warn{border-left-color:var(--risk)} .note.good{border-left-color:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 13px;font-size:12px;font-weight:500;border:1px solid var(--line2);border-radius:20px;color:var(--tx2);transition:.15s}
.chip:hover{border-color:var(--acc);color:var(--tx)}
.chip[aria-pressed="true"]{background:var(--acc);color:#0A0D12;border-color:var(--acc);font-weight:600}
:root[data-theme="light"] .chip[aria-pressed="true"]{color:#fff}
input[type=range]{width:100%;accent-color:var(--acc);height:26px}
input[type=text],textarea,select{width:100%;background:var(--sunk);border:1px solid var(--line2);border-radius:7px;padding:9px 12px;color:var(--tx);font-family:inherit;font-size:14px}
textarea{min-height:64px;resize:vertical}
.heat{border-collapse:separate;border-spacing:2px}
.heat td{padding:0;border:none}
.hc{width:100%;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--mo);cursor:pointer;transition:.15s}
.hc:hover{outline:2px solid var(--acc)}
.h5{background:var(--good);color:#06120C} .h4{background:var(--goodS);color:var(--good)}
.h3{background:var(--warnS);color:var(--warn)} .h2{background:var(--cautS);color:var(--caut)}
.h1{background:var(--riskS);color:var(--risk)}
:root[data-theme="light"] .h5{color:#fff}
.heat th{background:none;padding:4px 3px;font-size:9px;text-align:center;border:none;position:static}
.heat td.yr{font-family:var(--mo);font-size:11px;color:var(--tx2);padding-right:8px;white-space:nowrap}
.tl{position:relative;padding:26px 0 10px;overflow-x:auto}
.tlline{position:absolute;left:0;right:0;top:52px;height:2px;background:var(--line2)}
.tlrow{display:flex;gap:0;min-width:820px;position:relative}
.tlev{flex:1;min-width:74px;text-align:center;position:relative;padding-top:34px;cursor:pointer}
.tlev .mk{position:absolute;top:0;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;border:2px solid var(--bg);transition:.15s}
.tlev:hover .mk{transform:translateX(-50%) scale(1.35)}
.tlev .ag{font-family:var(--mo);font-size:10px;color:var(--tx3)}
.tlev .lb{font-size:10.5px;color:var(--tx2);margin-top:2px;line-height:1.3;padding:0 3px}
.mk-h{background:var(--good)} .mk-m{background:var(--warn)} .mk-s{background:var(--tx3)}
.spark{width:100%;height:150px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--tx3);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.qa{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qrow{display:flex;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:13.5px}
.qrow:last-child{border-bottom:none}
.qrow .qq{font-weight:600;color:var(--acc2);min-width:190px}
.ask{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ask input{flex:1;min-width:220px}
.ask button.go{background:var(--acc);color:#0A0D12;font-weight:600;padding:9px 18px;border-radius:7px}
:root[data-theme="light"] .ask button.go{color:#fff}
.saved{font-size:11px;color:var(--good);margin-left:8px}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:18px;font-size:12px;color:var(--tx3);max-width:80ch}
@media(max-width:640px){
  main{padding:16px 13px 70px}
  .topin{padding:9px 13px;gap:9px}
  .tmeta{font-size:10px;gap:9px}
  .qrow{flex-direction:column;gap:3px}
  .qrow .qq{min-width:0}
  .big{font-size:25px}
}
</style>
